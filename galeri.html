<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeri Karya Mahasiswa — ITL Trisakti</title>
<meta name="description" content="Contoh karya mahasiswa ITL Trisakti dari semester sebelumnya, ditampilkan tanpa nama.">
<!-- Karya mahasiswa: jangan diindeks mesin pencari -->
<meta name="robots" content="noindex, nofollow">
<style>
:root{
  --navy:#0b1f3a;--navy2:#102b4d;--gold:#c9a227;--gold-soft:#fbf6e6;--gold-line:#ecdba6;
  --ink:#172033;--muted:#667085;--bg:#f5f7fa;--card:#fff;--line:#e4e7ec
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{color:inherit}
header{background:linear-gradient(135deg,#07172c,#0b1f3a);color:#fff;padding:22px 6vw;border-bottom:4px solid var(--gold)}
.brand{font-weight:800;letter-spacing:.045em}
.sub{opacity:.72;font-size:13px;margin-top:4px}
main{max-width:1240px;margin:auto;padding:36px 24px 72px}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--muted);text-decoration:none;font-weight:700;font-size:14px;padding:8px 0;min-height:44px}
.back:hover{color:var(--navy)}
.eyebrow{color:#8a6d12;font-weight:800;letter-spacing:.14em;font-size:12px;text-transform:uppercase;margin-top:18px}
h1{font-family:Georgia,serif;font-size:clamp(36px,5vw,60px);line-height:1.04;margin:10px 0 12px}
.lead{max-width:760px;color:var(--muted);font-size:17px;line-height:1.7;margin:0}
.guide{margin:30px 0 34px;padding:20px 22px;background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.guide div{font-size:14px;line-height:1.6;color:#4a4220}
.guide b{display:block;color:var(--navy);font-size:15px;margin-bottom:2px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 26px;position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.tab{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;border-radius:999px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;min-height:44px}
.tab span{color:var(--muted);font-weight:600;margin-left:4px}
.tab[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.tab[aria-pressed="true"] span{color:rgba(255,255,255,.7)}
.tab:focus-visible,.btn:focus-visible,.thumb:focus-visible,.close:focus-visible,.zoom:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
section.tugas{margin:0 0 46px}
.tugas-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:6px}
.tugas h2{font-family:Georgia,serif;font-size:28px;margin:0}
.tugas .count{color:var(--muted);font-size:14px;white-space:nowrap}
.tujuan{color:var(--muted);line-height:1.6;margin:6px 0 12px;max-width:820px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px;padding:0;list-style:none}
.chips li{font-size:12px;font-weight:700;color:var(--navy);background:#eef2f7;border-radius:6px;padding:5px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 5px 20px rgba(11,31,58,.045)}
.thumb{display:block;position:relative;aspect-ratio:4/3;background:#eef1f5;border:0;padding:0;width:100%;cursor:zoom-in;overflow:hidden;border-bottom:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;transition:transform .25s}
.thumb:hover img{transform:scale(1.03)}
.badge{position:absolute;top:10px;left:10px;background:var(--gold);color:var(--navy);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.meta{font-size:12px;color:var(--muted);letter-spacing:.04em}
.card h3{font-size:16px;line-height:1.4;margin:0;color:var(--navy)}
.bidang{align-self:flex-start;font-size:12px;font-weight:700;color:#7a6213;background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:6px;padding:3px 7px}
.actions{display:flex;gap:8px;margin-top:auto;padding-top:6px}
.btn{flex:1;display:inline-flex;justify-content:center;align-items:center;gap:6px;text-decoration:none;border-radius:9px;font-weight:700;font-size:14px;min-height:44px;padding:0 12px;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--navy);color:#fff;border:1px solid var(--navy)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--navy)}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;background:#fff}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:28px}
.course{display:block;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}
.course:hover{border-color:var(--navy)}
.course h3{font-family:Georgia,serif;font-size:22px;margin:0 0 6px}
.course p{margin:0;color:var(--muted)}
footer{padding:30px 6vw;color:var(--muted);font-size:12px;line-height:1.6;border-top:1px solid var(--line)}
/* penampil halaman */
dialog{border:0;padding:0;width:min(980px,100vw);max-width:100vw;height:100dvh;max-height:100dvh;margin:0 auto;background:#0e1626;color:#fff}
dialog::backdrop{background:rgba(7,15,28,.82)}
.v-bar{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0e1626;border-bottom:1px solid rgba(255,255,255,.12);z-index:2}
.v-title{flex:1;min-width:0;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-bar .btn{flex:none}
.close{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:9px;min-width:44px;min-height:44px;font-size:20px;cursor:pointer}
.v-pages{height:calc(100dvh - 65px);overflow:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.v-pages img{width:100%;max-width:940px;height:auto;background:#fff;border-radius:4px}
.v-pages.zoomed{align-items:flex-start}
.v-pages.zoomed img{width:auto;max-width:none}
.zoom{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:9px;min-height:44px;padding:0 12px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.zoom[aria-pressed="true"]{background:#fff;color:var(--navy)}
.v-note{font-size:12px;color:rgba(255,255,255,.6);text-align:center;padding:4px 0 20px}
@media(max-width:760px){
  .guide{grid-template-columns:1fr;gap:12px}
  .tugas-head{flex-direction:column;align-items:flex-start;gap:2px}
  main{padding-top:24px}
  .v-pages{padding:8px}
}
@media(prefers-reduced-motion:reduce){.thumb img{transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
  <div class="brand">INSTITUT TRANSPORTASI DAN LOGISTIK TRISAKTI</div>
  <div class="sub">Academic Digital Hub · Galeri Karya Mahasiswa</div>
</header>

<main>
  <a class="back" href="index.html">← Kembali ke Academic Digital Hub</a>
  <div id="app" aria-live="polite"><div class="empty">Memuat galeri…</div></div>
</main>

<footer>
  Karya ditampilkan tanpa nama: nama, NIM, dan nama perusahaan telah disamarkan.
  Mahasiswa yang ingin karyanya diturunkan dapat menghubungi dosen pengampu.
</footer>

<dialog id="viewer" aria-labelledby="v-title">
  <div class="v-bar">
    <div class="v-title" id="v-title"></div>
    <button class="zoom" id="v-zoom" type="button" aria-pressed="false">Perbesar</button>
    <a class="btn ghost" id="v-pdf" href="#" download>PDF ↓</a>
    <button class="close" id="v-close" type="button" aria-label="Tutup">×</button>
  </div>
  <div class="v-pages" id="v-pages"></div>
</dialog>

<script>
(function(){
  'use strict';
  const DATA_URL = 'galeri/galeri.json';
  const app = document.getElementById('app');
  const viewer = document.getElementById('viewer');
  const vPages = document.getElementById('v-pages');
  const vTitle = document.getElementById('v-title');
  const vPdf = document.getElementById('v-pdf');
  const vZoom = document.getElementById('v-zoom');
  function setZoom(on){ vPages.classList.toggle('zoomed', on); vZoom.setAttribute('aria-pressed', String(on)); vZoom.textContent = on ? 'Pas layar' : 'Perbesar'; }
  vZoom.addEventListener('click', () => setZoom(!vPages.classList.contains('zoomed')));

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  }
  function norm(s){ return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }
  function nomor(id){ const m = String(id).match(/(\d+)$/); return m ? m[1] : id; }

  // Path file karya: <folder>/<id>.pdf, <id>-thumb.jpg, <id>-p<n>.jpg
  function fileBase(mk, k){ return 'galeri/' + mk.folder + '/' + k.id; }

  function cardHtml(mk, t, k){
    const base = fileBase(mk, k);
    const judul = k.topik || ('Karya ' + nomor(k.id));
    return `
      <article class="card">
        <button class="thumb" type="button" data-open="${esc(k.id)}" aria-label="Lihat karya: ${esc(judul)}">
          <img src="${esc(base)}-thumb.jpg" alt="" loading="lazy" decoding="async" width="720" height="540">
          ${k.pilihan ? '<span class="badge">Pilihan dosen</span>' : ''}
        </button>
        <div class="body">
          <div class="meta">Karya ${esc(nomor(k.id))} · ${esc(k.halaman)} halaman</div>
          <h3>${esc(judul)}</h3>
          ${k.bidang ? `<span class="bidang">${esc(k.bidang)}</span>` : ''}
          <div class="actions">
            <button class="btn primary" type="button" data-open="${esc(k.id)}">Lihat</button>
            <a class="btn ghost" href="${esc(base)}.pdf" download>PDF ↓</a>
          </div>
        </div>
      </article>`;
  }

  function renderCourse(mk){
    document.title = 'Galeri ' + mk.nama + ' — ITL Trisakti';
    const tugas = (mk.tugas || []).filter(t => (t.karya || []).length);
    const total = tugas.reduce((n, t) => n + t.karya.length, 0);
    const lookup = {};
    tugas.forEach(t => t.karya.forEach(k => { lookup[k.id] = {t, k}; }));

    app.innerHTML = `
      <div class="eyebrow">Galeri karya mahasiswa · ${esc(mk.semester || '')}</div>
      <h1>${esc(mk.nama)}</h1>
      <p class="lead">${esc(mk.pengantar || 'Contoh karya mahasiswa semester sebelumnya, ditampilkan tanpa nama.')}</p>
      <div class="guide" role="note">
        <div><b>Lihat cara berpikirnya</b>Perhatikan bagaimana masalah dibingkai dan didukung data, bukan hanya tampilannya.</div>
        <div><b>Bandingkan dengan instruksi</b>Setiap bagian tugas diringkas di atas daftar karya. Cek mana yang dijawab kuat dan mana yang belum.</div>
        <div><b>Bukan kunci jawaban</b>Karya ini punya kelebihan dan kekurangan. Jadikan inspirasi, jangan disalin: topik Anda harus dari pengalaman Anda sendiri.</div>
      </div>
      ${tugas.length ? `
      <div class="tabs" role="group" aria-label="Saring menurut tugas">
        <button class="tab" type="button" data-filter="semua" aria-pressed="true">Semua<span>${total}</span></button>
        ${tugas.map(t => `<button class="tab" type="button" data-filter="${esc(t.kode)}" aria-pressed="false">${esc(t.label || t.judul)}<span>${t.karya.length}</span></button>`).join('')}
      </div>
      ${tugas.map(t => `
        <section class="tugas" data-tugas="${esc(t.kode)}" aria-labelledby="h-${esc(t.kode)}">
          <div class="tugas-head">
            <h2 id="h-${esc(t.kode)}">${esc(t.judul)}</h2>
            <div class="count">${t.karya.length} karya</div>
          </div>
          ${t.tujuan ? `<p class="tujuan">${esc(t.tujuan)}</p>` : ''}
          ${(t.komponen || []).length ? `<ul class="chips" aria-label="Komponen tugas">${t.komponen.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}
          <div class="grid">${t.karya.map(k => cardHtml(mk, t, k)).join('')}</div>
        </section>`).join('')}`
      : '<div class="empty">Belum ada karya yang ditampilkan untuk mata kuliah ini.</div>'}`;

    app.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
      const f = b.dataset.filter;
      app.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      app.querySelectorAll('section.tugas').forEach(s => { s.hidden = f !== 'semua' && s.dataset.tugas !== f; });
    }));
    app.addEventListener('click', e => {
      const el = e.target.closest('[data-open]');
      if (el && lookup[el.dataset.open]) openViewer(mk, lookup[el.dataset.open].k, el);
    });
  }

  let lastFocus = null;
  function openViewer(mk, k, from){
    const base = fileBase(mk, k);
    const n = Math.max(1, parseInt(k.halaman, 10) || 1);
    lastFocus = from;
    vTitle.textContent = 'Karya ' + nomor(k.id) + (k.topik ? ' · ' + k.topik : '');
    vPdf.href = base + '.pdf';
    let html = '';
    for (let i = 1; i <= n; i++){
      html += `<img src="${esc(base)}-p${i}.jpg" alt="Halaman ${i} dari ${n}" loading="${i === 1 ? 'eager' : 'lazy'}" decoding="async">`;
    }
    vPages.innerHTML = html + '<div class="v-note">Nama, NIM, dan nama perusahaan disamarkan</div>';
    setZoom(false);
    vPages.scrollTop = 0;
    if (typeof viewer.showModal === 'function') viewer.showModal(); else window.open(base + '.pdf', '_blank', 'noopener');
  }
  function closeViewer(){ if (viewer.open) viewer.close(); }
  document.getElementById('v-close').addEventListener('click', closeViewer);
  viewer.addEventListener('click', e => { if (e.target === viewer) closeViewer(); });
  viewer.addEventListener('close', () => { vPages.innerHTML = ''; if (lastFocus) lastFocus.focus(); });

  function renderIndex(list){
    const shown = list.filter(mk => (mk.tugas || []).some(t => (t.karya || []).length));
    app.innerHTML = `
      <div class="eyebrow">Galeri karya mahasiswa</div>
      <h1>Galeri Karya</h1>
      <p class="lead">Contoh karya mahasiswa semester sebelumnya, ditampilkan tanpa nama.</p>
      ${shown.length ? `<div class="courses">${shown.map(mk => {
        const n = mk.tugas.reduce((s, t) => s + (t.karya || []).length, 0);
        return `<a class="course" href="galeri.html?mk=${encodeURIComponent(mk.nama)}"><h3>${esc(mk.nama)}</h3><p>${n} karya · ${esc(mk.semester || '')}</p></a>`;
      }).join('')}</div>` : '<div class="empty">Belum ada karya yang ditampilkan.</div>'}`;
  }

  async function load(){
    try{
      const r = await fetch(DATA_URL + '?v=' + Date.now(), {cache: 'no-store'});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      const list = Array.isArray(data.mata_kuliah) ? data.mata_kuliah : [];
      const want = norm(new URLSearchParams(location.search).get('mk'));
      const mk = want && list.find(m => norm(m.nama) === want);
      if (mk) renderCourse(mk); else renderIndex(list);
    }catch(e){
      app.innerHTML = '<div class="empty">Galeri belum dapat dimuat. Coba muat ulang halaman.</div>';
    }
  }
  load();
})();
</script>
</body>
</html>
