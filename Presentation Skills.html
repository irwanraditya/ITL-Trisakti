<!DOCTYPE html>
<html lang="id" data-theme="light" data-mode="learn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="FMCG Business Presentation Skills — interactive masterclass. Structure, clarity, data craft, format, confidence, engagement.">
<title>Business Presentation Skills — Interactive Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link media="all" onerror="this.remove()" rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
/* =====================================================================
   styles.css — FMCG Business Presentation Skills (aplikasi interaktif)
   Token desain, dua tema, komponen, dan perilaku responsif.
   ===================================================================== */

/* ------------------------------------------------------------- tokens -- */
:root{
  --navy:#0B1F33; --navy-2:#12324F; --teal:#0E7C6B; --teal-2:#14A08A;
  --blue:#2456C7; --purple:#6B3FA0; --orange:#E08424; --red:#B4402F;
  --ink:#0B1F33; --ink-2:#40566B; --ink-3:#7089A0;
  --bg:#F6F8FA; --surface:#FFFFFF; --surface-2:#EEF2F6; --line:#D3DEE7;
  --accent:var(--teal); --on-accent:#fff;
  --shadow:0 1px 2px rgba(11,31,51,.06), 0 8px 24px rgba(11,31,51,.08);
  --shadow-lg:0 12px 40px rgba(11,31,51,.16);
  --r:10px; --r-lg:16px;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --maxw:1100px;
}
html[data-theme="dark"]{
  --navy:#06131F; --navy-2:#0E2436; --teal:#2FA894; --teal-2:#3FBFA8;
  --blue:#5B8AF0; --purple:#A183D6; --orange:#E7A44C; --red:#E0725F;
  --ink:#E9F0F5; --ink-2:#AEC2D2; --ink-3:#7B94A8;
  --bg:#081521; --surface:#0F2434; --surface-2:#16324a; --line:#23415C;
  --accent:var(--teal-2); --on-accent:#04181a;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 14px 44px rgba(0,0,0,.5);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.6;min-height:100vh;
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ------------------------------------------------------------ topbar --- */
#top{
  position:sticky;top:0;z-index:60;background:var(--navy);color:#fff;
  border-bottom:1px solid rgba(255,255,255,.1)
}
.topin{max-width:var(--maxw);margin:0 auto;padding:.55rem 1rem;
  display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:auto;min-width:0}
.brand b{font-size:.95rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;
  text-transform:uppercase;color:#8FB3C4}
.tbtn{background:#1B3A56;color:#DCE9F1;border:none;border-radius:8px;
  padding:.5rem .7rem;min-height:40px;cursor:pointer;font-size:.8rem;
  display:inline-flex;align-items:center;gap:.35rem}
.tbtn:hover{background:#27506F}
.tbtn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg{display:flex;border:1px solid #2B5273;border-radius:8px;overflow:hidden}
.seg .tbtn{border-radius:0;min-width:42px;justify-content:center}
#searchWrap{position:relative;flex:1 1 200px;max-width:280px}
#search{width:100%;background:#10293F;border:1px solid #2B5273;color:#fff;
  border-radius:8px;padding:.55rem .7rem;min-height:40px;font-size:.82rem}
#search::placeholder{color:#7FA0B5}
#results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);
  color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);
  max-height:60vh;overflow:auto;display:none;z-index:80}
#results.on{display:block}
#results button{display:block;width:100%;text-align:left;background:none;border:none;
  padding:.6rem .8rem;cursor:pointer;border-bottom:1px solid var(--line)}
#results button:hover{background:var(--surface-2)}
#results .rk{font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);display:block}
#results .rt{font-size:.85rem;font-weight:600}
#results .rs{font-size:.75rem;color:var(--ink-2)}

/* progress */
#bar{height:3px;background:var(--accent);width:0;transition:width .25s}

/* ------------------------------------------------------------- layout -- */
#main{flex:1;max-width:var(--maxw);width:100%;margin:0 auto;padding:1.4rem 1rem 5rem}
.sec{display:none;animation:fade .25s ease}
.sec.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.kicker{font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:.5rem}
h1.t{font-family:var(--serif);font-weight:400;font-size:clamp(1.6rem,4.2vw,2.5rem);
  line-height:1.16;letter-spacing:-.01em;margin-bottom:.5rem}
p.lead{font-size:1.02rem;color:var(--ink-2);max-width:62ch;margin-bottom:1.5rem}

/* ---------------------------------------------------------- komponen --- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:1rem 1.05rem;box-shadow:var(--shadow)}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.n{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);display:block;margin-bottom:.45rem}
.card h3{font-size:1rem;margin-bottom:.35rem}
.card p{font-size:.9rem;color:var(--ink-2)}
.tags{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.6rem}
.tag{font-family:var(--mono);font-size:.6rem;letter-spacing:.05em;padding:.2rem .45rem;
  background:var(--surface-2);border:1px solid var(--line);border-radius:5px;color:var(--ink-2)}

.band{background:var(--accent);color:var(--on-accent);padding:.8rem 1rem;border-radius:var(--r);
  font-weight:600;margin-top:1.2rem}
.band.dark{background:var(--navy);color:#fff}
.note{font-size:.8rem;color:var(--ink-3);margin-top:1rem}
.quote{font-family:var(--serif);font-size:1.15rem;line-height:1.5;color:var(--ink);
  border-left:3px solid var(--accent);padding:.4rem 0 .4rem 1rem;margin-top:1.2rem}
.pills{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:.35rem .8rem;font-size:.8rem;font-weight:600;box-shadow:var(--shadow)}

/* before / after */
.ba{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.ba .col{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.ba .lab{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;
  padding:.5rem .8rem;color:#fff}
.ba .bad .lab{background:var(--red)} .ba .good .lab{background:var(--teal)}
.ba .bd{padding:1rem}
.ba .hd{font-weight:600;margin-bottom:.6rem}
.ba .good .hd{font-size:1.02rem}
.ba .bdy{font-size:.86rem;color:var(--ink-2)}
.ba .vd{font-size:.82rem;font-style:italic;margin-top:.7rem}
.ba .bad .vd{color:var(--red)} .ba .good .vd{color:var(--teal)}
.whyBox{margin-top:.9rem;background:var(--surface-2);border-left:3px solid var(--accent);
  padding:.8rem .9rem;border-radius:0 var(--r) var(--r) 0;font-size:.88rem;color:var(--ink-2)}

/* vs lists */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.vs .col{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.vs .lab{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;
  padding:.5rem .8rem;color:#fff;background:var(--ink-2)}
.vs .bad .lab{background:var(--red)} .vs .good .lab{background:var(--teal)}
.vs ul{list-style:none;padding:.6rem .9rem 1rem}
.vs li{font-size:.88rem;padding:.4rem 0 .4rem 1.3rem;position:relative;color:var(--ink-2)}
.vs li::before{position:absolute;left:0;top:.4rem;font-weight:700}
.vs .bad li::before{content:"×";color:var(--red)}
.vs .good li::before{content:"✓";color:var(--teal)}
.vs .neutral li::before{content:"·";color:var(--ink-3)}

/* order flow */
.orders{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.flowlab{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:.5rem}
.flow{display:flex;flex-wrap:wrap;gap:.35rem}
.node{background:var(--surface);border:1px solid var(--line);border-radius:7px;
  padding:.4rem .6rem;font-size:.8rem;font-weight:600}
.node.first{background:var(--teal);color:#fff;border-color:transparent}
.node.qm{color:var(--red);border-color:var(--red)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem;box-shadow:var(--shadow)}
.stat .big{font-size:2.4rem;font-weight:700;color:var(--accent);line-height:1}
.stat .cap{font-weight:600;margin:.4rem 0 .35rem}
.stat .sub{font-size:.85rem;color:var(--ink-2)}
.stat .ex{margin-top:.7rem;font-size:.78rem;color:var(--ink-3);
  background:var(--surface-2);padding:.45rem .6rem;border-radius:7px}

.split2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.split2 .p{border-radius:var(--r);padding:1.2rem;border:1px solid var(--line);background:var(--surface)}
.split2 .p.acc{background:var(--orange);border-color:transparent;color:#20130a}
.split2 .big{font-size:2.6rem;font-weight:700;line-height:1}

/* SIAP */
.siap{display:flex;flex-direction:column;gap:.5rem}
.srow{display:grid;grid-template-columns:2.4rem 8rem minmax(0,1fr);gap:.9rem;align-items:center;
  background:var(--surface-2);border-radius:var(--r);padding:.85rem 1rem}
.srow.push{background:var(--navy);color:#fff}
.srow .k{width:2rem;height:2rem;display:flex;align-items:center;justify-content:center;
  background:var(--teal);color:#fff;font-weight:700;border-radius:7px}
.srow.push .k{background:var(--orange);color:#20130a}
.srow .t{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.srow.push .t{color:#93AEC2}
.srow .t small{display:block;text-transform:none;letter-spacing:0;font-size:.68rem;font-style:italic}
.srow .v{font-size:.92rem}

/* builders */
.builder{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.1rem;box-shadow:var(--shadow);margin-top:1.2rem}
.builder h4{font-size:.95rem;margin-bottom:.2rem}
.builder .hint{font-size:.82rem;color:var(--ink-2);margin-bottom:.9rem}
.field{margin-bottom:.75rem}
.field label{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:.3rem}
.field input,.field textarea,.field select{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:.6rem .7rem;font-size:.9rem;min-height:44px}
.field textarea{min-height:66px;resize:vertical}
.brow{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.4rem}
.btn{background:var(--accent);color:var(--on-accent);border:none;border-radius:8px;
  padding:.6rem .95rem;min-height:44px;font-weight:600;font-size:.85rem;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.sm{min-height:38px;padding:.45rem .7rem;font-size:.78rem}
.out{margin-top:.9rem;background:var(--surface-2);border-radius:var(--r);padding:.9rem;
  font-size:.9rem;white-space:pre-wrap}
.meter{height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:.5rem 0}
.meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:600;
  padding:.2rem .5rem;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.chip.ok{background:rgba(14,124,107,.15);color:var(--teal)}
.chip.no{background:rgba(180,64,47,.14);color:var(--red)}

/* anatomy */
.anat{background:var(--navy);color:#fff;border-radius:var(--r);padding:1.1rem;font-size:1.02rem;
  font-weight:600;line-height:1.5}
.anat .p1{color:var(--orange)} .anat .p2{color:#fff}
.anat .p3{color:#B79BE0} .anat .p4{color:#5FD2B8}
.anatKey{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin-top:.9rem}
.anatKey .k{border:1px solid var(--line);border-radius:var(--r);padding:.7rem;background:var(--surface)}
.anatKey .kn{font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.anatKey b{display:block;margin:.25rem 0}
.anatKey p{font-size:.78rem;color:var(--ink-2)}

/* ladder */
.ladder{overflow-x:auto}
.ladder table{border-collapse:collapse;width:100%;min-width:640px}
.ladder th{font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);text-align:left;padding:0 .8rem .5rem 0;border-bottom:2px solid var(--ink)}
.ladder td{padding:.7rem .8rem .7rem 0;border-bottom:1px solid var(--line);
  vertical-align:top;font-size:.86rem;color:var(--ink-2)}
.ladder td.fn{font-weight:700;color:#fff;background:var(--teal);border-radius:7px;
  padding:.5rem .6rem;font-size:.72rem;white-space:nowrap}
.ladder td.dec{color:var(--ink);font-weight:600}

/* storylines */
.story{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.story .h{padding:.7rem .9rem;color:#fff}
.story:nth-child(1) .h{background:var(--teal)}
.story:nth-child(2) .h{background:var(--blue)}
.story:nth-child(3) .h{background:var(--red)}
.story .h b{display:block;font-size:.95rem}
.story .h i{font-size:.8rem;opacity:.9}
.story ol{list-style:none;counter-reset:s;padding:.7rem .9rem}
.story li{counter-increment:s;font-size:.86rem;padding:.35rem 0 .35rem 1.6rem;position:relative}
.story li::before{content:counter(s);position:absolute;left:0;top:.35rem;width:1.1rem;height:1.1rem;
  border-radius:50%;background:var(--surface-2);font-size:.65rem;display:flex;align-items:center;
  justify-content:center;font-weight:700;color:var(--ink-2)}
.story .use{padding:.6rem .9rem .9rem;font-size:.76rem;color:var(--ink-3);border-top:1px solid var(--line)}

/* zones */
.zonesWrap{display:grid;grid-template-columns:1.3fr 1fr;gap:1rem}
.zoneSlide{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:.9rem;
  display:flex;flex-direction:column;gap:.6rem}
.zoneSlide .z{border-radius:8px;padding:.6rem .7rem;font-size:.8rem;cursor:pointer;
  border:1px dashed var(--line);background:var(--surface-2);transition:.15s}
.zoneSlide .z.sel{border-style:solid;border-color:var(--accent);background:rgba(14,124,107,.12)}
.zoneSlide .zt{background:rgba(107,63,160,.12)}
.zoneSlide .zrow{display:grid;grid-template-columns:1.6fr 1fr;gap:.6rem}
.zoneList{display:flex;flex-direction:column;gap:.5rem}
.zoneList .zi{border:1px solid var(--line);border-radius:8px;padding:.6rem .7rem;background:var(--surface);
  cursor:pointer;font-size:.84rem}
.zoneList .zi.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(14,124,107,.18)}
.zoneList .zi b{display:block;font-size:.86rem}
.zoneList .zi span{color:var(--ink-2);font-size:.8rem}

/* six second */
.ss{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:1.1rem;
  box-shadow:var(--shadow);margin-top:1.2rem}
.ssSlide{border:1px solid var(--line);border-radius:var(--r);padding:1rem;background:var(--bg)}
.ssTitle{font-weight:700;font-size:1rem;margin-bottom:.8rem}
.bars{display:flex;gap:.8rem;align-items:flex-end;height:120px;margin:.6rem 0}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bars .b i{display:block;width:100%;background:#C6D3DC;border-radius:4px 4px 0 0}
.bars .b.hi i{background:var(--purple)}
.bars .b span{font-size:.7rem;margin-top:.3rem;color:var(--ink-2);text-align:center}
.bars .b em{font-size:.78rem;font-weight:700;font-style:normal;margin-bottom:.25rem}
.ssAside{display:flex;flex-direction:column;gap:.6rem}
.calloutBox{background:var(--orange);color:#20130a;border-radius:8px;padding:.7rem;text-align:center}
.calloutBox b{display:block;font-size:1.9rem;line-height:1}
.askBox{background:var(--navy);color:#fff;border-radius:8px;padding:.6rem .7rem;font-size:.82rem;font-weight:600}
.timer{font-family:var(--mono);font-size:2.2rem;font-weight:700;color:var(--accent);text-align:center}
.qBlock{margin-top:.8rem}
.opt{display:block;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);
  border-radius:8px;padding:.6rem .7rem;margin-bottom:.4rem;cursor:pointer;font-size:.86rem}
.opt:hover{border-color:var(--accent)}
.opt.ok{background:rgba(14,124,107,.16);border-color:var(--teal)}
.opt.no{background:rgba(180,64,47,.14);border-color:var(--red)}

/* one dataset three charts */
.three-charts{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.cc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:.9rem}
.cc h4{font-size:.85rem;margin-bottom:.6rem;background:var(--surface-2);padding:.45rem .6rem;border-radius:7px}
.cc .cap{font-size:.75rem;color:var(--ink-3);margin-top:.5rem}
.hbar{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem;font-size:.72rem}
.hbar span{width:5.2rem;color:var(--ink-2)}
.hbar i{display:block;height:14px;background:var(--blue);border-radius:3px}
.hbar b{font-size:.72rem}
.spark{height:70px;display:flex;align-items:flex-end;gap:.25rem}
.spark i{flex:1;background:#C6D3DC;border-radius:2px 2px 0 0}
.spark i.hi{background:var(--blue)}

/* chart selector */
.selWrap{display:grid;grid-template-columns:1fr 1.2fr;gap:1rem;margin-top:1rem}
.selList{display:flex;flex-direction:column;gap:.4rem;max-height:340px;overflow:auto}
.selList button{text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:8px;padding:.6rem .7rem;cursor:pointer;font-size:.86rem}
.selList button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.selOut .card{margin-bottom:.7rem}
.selOut .use{border-left:4px solid var(--teal)}
.selOut .never{border-left:4px solid var(--red)}

/* chart crimes */
.crimes{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem}
.crime{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;
  cursor:pointer;transition:.15s}
.crime:hover{border-color:var(--red)}
.crime .ch{background:var(--red);color:#fff;padding:.5rem .7rem;font-size:.78rem;font-weight:600}
.crime .cb{padding:.8rem}
.crime .fix{display:none;border-top:1px solid var(--line);padding:.8rem;background:var(--surface-2);font-size:.82rem}
.crime.open .fix{display:block}
.crime .fix b{color:var(--teal)}
.miniTrunc{height:70px;display:flex;align-items:flex-end;gap:.5rem;border-bottom:2px solid var(--red)}
.miniTrunc i{flex:1;background:var(--red);border-radius:3px 3px 0 0}
.mini3d{display:flex;gap:.4rem;align-items:flex-end;height:70px}
.mini3d i{flex:1;background:var(--red);border-radius:3px;transform:skewY(-6deg)}
.miniPie{width:70px;height:70px;border-radius:50%;margin:0 auto;
  background:conic-gradient(var(--red) 0 12%,#d8766a 0 24%,#e0907f 0 36%,#c95e4c 0 48%,
  #b4402f 0 60%,#dd8a78 0 72%,#cf6e5b 0 84%,#a83a2a 0 100%)}
.miniDual{height:70px;position:relative}
.miniDual i{position:absolute;left:0;right:0;height:2px;background:var(--red);top:50%}

#foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);

/* ------------------------------------------------------------ drawer --- */
#drawer{position:fixed;inset:0;background:rgba(6,19,31,.55);display:none;z-index:90}

html[data-mode="present"] #top .tbtn.hideP,
html[data-mode="present"] #searchWrap{display:none}
html[data-mode="present"] .learnOnly{display:none !important}
html[data-mode="present"] #main{max-width:1200px;padding-top:2.4rem}

html[data-mode="present"] .note{display:none}

@media (max-width:900px){
  .g3,.g4,.stats,.anatKey,.crimes,.beats,.pbGrid,.three-charts{grid-template-columns:repeat(2,1fr)}

}
@media (max-width:640px){

@media print{

}
@media (prefers-reduced-motion:reduce){

        '<p style="font-weight:600;margin-bottom:.4rem">' + esc(L(x.text)) + '</p>' +
        '<p style="font-size:.84rem;color:var(--ink-2)">' + esc(L(x.note)) + '</p></div>';
    }).join('') + '</div>';
  };

  /* ----------------------------------------------------------- render -- */
  function renderSection(sec, idx) {
    var html = '<section class="sec" id="s' + (idx + 1) + '" data-sec="' + sec.id + '">' +
      '<p class="kicker">' + esc(L(sec.kicker)) + '</p>' +
      '<h1 class="t">' + esc(L(sec.title)) + '</h1>' +
      (sec.lead ? '<p class="lead">' + esc(L(sec.lead)) + '</p>' : '');
    sec.blocks.forEach(function (b) {
      var fn = B[b.t];
      if (fn) html += fn(b);
    });
    return html + '</section>';
  }

  function renderAll() {
    $('#main').innerHTML = SECTIONS.map(renderSection).join('');
    buildTOC();
    show(S.i, true);
    labels();
  }

  function labels() {
    $('#search').placeholder = t('search');
    $('#bprev').textContent = '◀ ' + t('prev');
    $('#bnext').textContent = t('next') + ' ▶';
    $('#btoc').textContent = t('toc');
    $('#bmode').textContent = S.mode === 'learn' ? t('modeLearn') : t('modePresent');
    $('#bmode').setAttribute('aria-pressed', S.mode === 'present');
    $('#bid').setAttribute('aria-pressed', S.lang === 'id');
    $('#ben').setAttribute('aria-pressed', S.lang === 'en');
    $('#blight').setAttribute('aria-pressed', S.theme === 'light');
    $('#bdark').setAttribute('aria-pressed', S.theme === 'dark');
    $('#tocTitle').textContent = t('toc');
    $('#kb').textContent = t('keyboard');
  }

  function buildTOC() {
    $('#tocList').innerHTML = SECTIONS.map(function (s, i) {
      return '<button class="item" data-goto="' + i + '"><span class="no">' +
        String(i + 1).padStart(2, '0') + '</span>' + esc(L(s.title)) + '</button>';
    }).join('');
  }

  function show(i, silent) {
    S.i = Math.max(0, Math.min(SECTIONS.length - 1, i));
    $$('.sec').forEach(function (el, k) { el.classList.toggle('on', k === S.i); });
    $$('#tocList .item').forEach(function (b, k) {
      b.setAttribute('aria-current', k === S.i ? 'true' : 'false');
    });
    $('#bar').style.width = ((S.i + 1) / SECTIONS.length * 100) + '%';
    $('#meta').textContent = t('section') + ' ' + (S.i + 1) + ' / ' + SECTIONS.length;
    $('#bprev').disabled = S.i === 0;
    $('#bnext').disabled = S.i === SECTIONS.length - 1;
    try { history.replaceState(null, '', '#s' + (S.i + 1)); } catch (e) {}
    window.scrollTo({ top: 0, behavior: silent ? 'auto' : 'smooth' });
    initWidgets();
    save();
  }

  /* -------------------------------------------------------- interaksi -- */
  function initWidgets() {
    var sec = $$('.sec')[S.i];
    if (!sec) return;
    var sel = $('[data-w="sel"]', sec); if (sel) paintSel(sel);
    var d = $('[data-w="dens"]', sec); if (d) paintDens(d);
    var hq = $('[data-w="hq"]', sec); if (hq) paintHQ(hq);
    var pf = $('[data-w="pf"]', sec); if (pf) paintPF(pf);
  }

  function paintSel(root) {
    var r = DATA.chartPicker[S.lang][S.sel];
    $('.selOut', root).innerHTML =
      '<div class="card use"><span class="n">' + (S.lang === 'id' ? 'Pakai ini' : 'Use this') + '</span><p style="font-size:1rem;font-weight:600;color:var(--ink)">' + esc(r[1]) + '</p></div>' +
      '<div class="card never"><span class="n" style="color:var(--red)">' + (S.lang === 'id' ? 'Jangan' : 'Never') + '</span><p style="font-size:.95rem;color:var(--red)">' + esc(r[2]) + '</p></div>';
    $$('[data-sel]', root).forEach(function (b) {
      b.setAttribute('aria-pressed', +b.dataset.sel === S.sel);
    });
  }

  function paintDens(root) {
    var d = DATA.density[S.lang][S.dens];
    var lvl = { live: 1, report: 2, training: 3, onepager: 4 }[S.dens];
    $('.densBody', root).innerHTML =
      '<div class="densGauge"><div class="lvl">' + esc(d[1]) + '</div>' +
      '<div class="dots">' + [1, 2, 3, 4].map(function (n) {
        return '<i class="' + (n <= lvl ? 'on' : '') + '"></i>';
      }).join('') + '</div><b>' + esc(d[0]) + '</b><p style="font-size:.84rem;color:var(--ink-2);margin-top:.4rem">' +
      esc(d[2]) + '</p></div>' +
      '<div class="card"><span class="n">' + (S.lang === 'id' ? 'Aturannya' : 'Rules') + '</span><ul style="list-style:none">' +
      d[3].map(function (x) {
        return '<li style="font-size:.88rem;padding:.3rem 0 .3rem 1.2rem;position:relative;color:var(--ink-2)">' +
          '<span style="position:absolute;left:0;color:var(--teal)">✓</span>' + esc(x) + '</li>';
      }).join('') + '</ul></div>';
    $$('[data-dens]', root).forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.dens === S.dens);
    });
  }

  function paintHQ(root) {
    var qs = DATA.hardQ[S.lang];
    $('.hqBody', root).innerHTML = qs.map(function (q, i) {
      return '<div class="card" style="margin-bottom:.8rem" data-hq="' + i + '">' +
        '<p style="font-weight:600;margin-bottom:.6rem">' + esc(q.q) + '</p>' +
        q.a.map(function (a, j) {
          return '<button class="opt" data-hqa="' + i + '-' + j + '">' + esc(a) + '</button>';
        }).join('') + '<div class="whyBox" hidden></div></div>';
    }).join('');
  }

  function paintPF(root) {
    var it = DATA.preflight[S.lang];
    var n = it.filter(function (_, i) { return S.pf[i]; }).length;
    var pct = Math.round(n / it.length * 100);
    $('.pfScore', root).innerHTML = '<div class="pct">' + pct + '%</div>' +
      '<div style="flex:1"><div class="meter"><i style="width:' + pct + '%"></i></div>' +
      '<b>' + (pct === 100 ? t('ready') : t('keepGoing')) + '</b> · ' + n + '/' + it.length + ' ' + t('pctReady') + '</div>';
  }

  /* ------------------------------------------------------------ events - */
  document.addEventListener('click', function (e) {
    var el;

    if ((el = e.target.closest('[data-goto]'))) { show(+el.dataset.goto); closeDrawer(); return; }
    if ((el = e.target.closest('[data-go]'))) {
      var idx = SECTIONS.findIndex(function (s) { return s.id === el.dataset.go; });
      if (idx > -1) { show(idx); return; }
    }
    if ((el = e.target.closest('[data-act="why"]'))) {
      var box = el.nextElementSibling;
      box.hidden = !box.hidden;
      el.textContent = box.hidden ? t('showWhy') : t('hideWhy');
      return;
    }
    if ((el = e.target.closest('[data-z]'))) {
      var z = el.dataset.z, root = el.closest('.zonesWrap');
      $$('[data-z]', root).forEach(function (x) { x.classList.toggle('sel', x.dataset.z === z); });
      return;
    }
    if ((el = e.target.closest('[data-crime]'))) { el.classList.toggle('open'); return; }
    if ((el = e.target.closest('[data-sel]'))) { S.sel = +el.dataset.sel; paintSel(el.closest('[data-w="sel"]')); return; }
    if ((el = e.target.closest('[data-dens]'))) { S.dens = el.dataset.dens; paintDens(el.closest('[data-w="dens"]')); return; }
    if ((el = e.target.closest('[data-pf]'))) {
      var i = +el.dataset.pf; S.pf[i] = !S.pf[i];
      el.classList.toggle('on', !!S.pf[i]); el.setAttribute('aria-checked', !!S.pf[i]);
      paintPF(el.closest('[data-w="pf"]')); save(); return;
    }
    if ((el = e.target.closest('[data-act="pfClr"]'))) {
      S.pf = {}; var r = el.closest('[data-w="pf"]');
      $$('[data-pf]', r).forEach(function (x) { x.classList.remove('on'); x.setAttribute('aria-checked', 'false'); });
      paintPF(r); save(); return;
    }
    if ((el = e.target.closest('[data-hqa]'))) {
      var p = el.dataset.hqa.split('-'), qi = +p[0], ai = +p[1];
      var q = DATA.hardQ[S.lang][qi], card = el.closest('[data-hq]');
      $$('.opt', card).forEach(function (o, j) {
        o.classList.toggle('ok', j === q.c);
        o.classList.toggle('no', j === ai && ai !== q.c);
      });
      var w = $('.whyBox', card);
      w.hidden = false;
      w.innerHTML = '<b>' + (ai === q.c ? t('correct') : t('notQuite')) + '.</b> ' + esc(q.why);
      return;
    }
    if ((el = e.target.closest('[data-copy]'))) {
      try { navigator.clipboard.writeText(el.dataset.copy); } catch (x) {}
      var old = el.style.background; el.style.background = 'rgba(14,124,107,.2)';
      setTimeout(function () { el.style.background = old; }, 400);
      return;
    }

    /* builders */
    if ((el = e.target.closest('[data-act="siapGo"],[data-act="siapEx"],[data-act="siapClr"]'))) {
      var root2 = el.closest('[data-w="siap"]'), ta = $$('textarea[data-s]', root2), out = $('.out', root2);
      var a = el.dataset.act;
      if (a === 'siapEx') {
        var ex = DATA.siapExample[S.lang], keys = ['S', 'I', 'A', 'P'];
        ta.forEach(function (x, i) { x.value = ex[keys[i]]; });
      }
      if (a === 'siapClr') { ta.forEach(function (x) { x.value = ''; }); out.hidden = true; return; }
      var v = ta.map(function (x) { return x.value.trim(); });
      var miss = v.map(function (x, i) { return x ? null : ['S', 'I', 'A', 'P'][i]; }).filter(Boolean);
      var push = v[3].toLowerCase();
      var hasDate = /(senin|selasa|rabu|kamis|jumat|sabtu|minggu|monday|tuesday|wednesday|thursday|friday|besok|tomorrow|q[1-4]|\d{1,2}\s|tanggal|by |sebelum|before)/.test(push);
      var hasVerb = push.split(/\s+/).length > 2;
      out.hidden = false;
      out.innerHTML = miss.length
        ? '<span class="chip no">' + (S.lang === 'id' ? 'Belum lengkap' : 'Incomplete') + '</span> ' +
          (S.lang === 'id' ? 'Kalimat yang masih kosong: ' : 'Still empty: ') + miss.join(', ')
        : '<b>' + (S.lang === 'id' ? 'Spine Anda' : 'Your spine') + '</b>\n\nS · ' + v[0] + '\nI · ' + v[1] +
          '\nA · ' + v[2] + '\nP · ' + v[3] + '\n\n' +
          '<span class="chip ' + (hasVerb ? 'ok' : 'no') + '">' + (S.lang === 'id' ? 'Push menyebut tindakan' : 'Push names an action') + '</span> ' +
          '<span class="chip ' + (hasDate ? 'ok' : 'no') + '">' + (S.lang === 'id' ? 'Push menyebut tenggat' : 'Push names a deadline') + '</span>' +
          (hasDate ? '' : '\n\n' + (S.lang === 'id'
            ? 'Tambahkan tanggal pada Push. Permintaan tanpa tanggal adalah topik, dan topik tidak pernah diputuskan.'
            : 'Add a date to the Push. An ask without a date is a topic, and topics do not get decided.'));
      return;
    }

    if ((el = e.target.closest('[data-act="titleGo"],[data-act="titleEx"]'))) {
      var r3 = el.closest('[data-w="title"]'), ins = $$('input[data-tp]', r3), o3 = $('.out', r3);
      var parts = DATA.titleParts[S.lang];
      if (el.dataset.act === 'titleEx') ins.forEach(function (x, i) { x.value = parts[i][1]; });
      var vals = ins.map(function (x) { return x.value.trim(); });
      var gaps = vals.map(function (x, i) { return x ? null : parts[i][0]; }).filter(Boolean);
      var title = vals.filter(Boolean).join(' ');
      var words = title ? title.split(/\s+/).length : 0;
      o3.hidden = false;
      o3.innerHTML = '<b>' + (S.lang === 'id' ? 'Judul Anda' : 'Your title') + '</b>\n' + (title || '—') + '\n\n' +
        '<span class="chip ' + (gaps.length ? 'no' : 'ok') + '">' + (4 - gaps.length) + '/4 ' +
        (S.lang === 'id' ? 'bagian' : 'parts') + '</span> ' +
        '<span class="chip ' + (words && words <= 20 ? 'ok' : 'no') + '">' + words + ' ' +
        (S.lang === 'id' ? 'kata' : 'words') + '</span>' +
        (gaps.length ? '\n\n' + (S.lang === 'id' ? 'Masih kurang: ' : 'Still missing: ') + gaps.join(', ') +
          (gaps.indexOf(parts[3][0]) > -1 ? '\n' + (S.lang === 'id'
            ? 'Bagian keempat adalah yang paling sering hilang — dan yang mengubah fakta menjadi keputusan.'
            : 'The fourth part is the one most often missing — and the one that turns a fact into a decision.') : '')
          : '');
      return;
    }

    if ((el = e.target.closest('[data-act="w1Go"]'))) {
      var r4 = el.closest('[data-w="w1"]'), v4 = $('textarea[data-w1]', r4).value.trim(), o4 = $('.out', r4);
      var w = v4 ? v4.split(/\s+/).length : 0;
      var hasNum = /\d/.test(v4);
      var hasVerb2 = w >= 5;
      var hasAsk = /(perlu|butuh|setujui|approve|need|sign|by |sebelum|before|rencana|plan)/i.test(v4);
      o4.hidden = false;
      o4.innerHTML = '<span class="chip ' + (w && w <= 16 ? 'ok' : 'no') + '">' + w + '/16 ' +
        (S.lang === 'id' ? 'kata' : 'words') + '</span> ' +
        '<span class="chip ' + (hasNum ? 'ok' : 'no') + '">' + (S.lang === 'id' ? 'ada angka' : 'has a number') + '</span> ' +
        '<span class="chip ' + (hasVerb2 ? 'ok' : 'no') + '">' + (S.lang === 'id' ? 'kalimat utuh' : 'full sentence') + '</span> ' +
        '<span class="chip ' + (hasAsk ? 'ok' : 'no') + '">' + (S.lang === 'id' ? 'ada permintaan' : 'has an ask') + '</span>\n\n' +
        (S.lang === 'id' ? 'Bandingkan dengan tiga jawaban di bawah — baik, lebih baik, terbaik.'
          : 'Compare with the three answers below — good, better, best.');
      return;
    }

    if ((el = e.target.closest('[data-act="planGo"],[data-act="planCopy"]'))) {
      var r5 = el.closest('[data-w="plan"]'), o5 = $('.out', r5), g = {};
      $$('[data-pl]', r5).forEach(function (x) { g[x.dataset.pl] = x.value.trim(); });
      var txt = (S.lang === 'id'
        ? '1 · Buka dengan angka\n   “' + (g.num || '—') + '”\n\n2 · Pola alur cerita\n   ' + (g.story || '—') +
          '\n\n3 · Judul temuan\n   ' + (g.topic || '—') + ' — ' + (g.num || '—') +
          '\n\n4 · Tutup dengan permintaan\n   ' + (g.ask || '—') + '\n   Pemilik dan tanggal: ' + (g.owner || '—') +
          '\n\n5 · Sebelum kirim\n   Tiga angka dikuasai · tiga pertanyaan sulit dijawab · 60 detik dilatih keras'
        : '1 · Open on the number\n   “' + (g.num || '—') + '”\n\n2 · Storyline pattern\n   ' + (g.story || '—') +
          '\n\n3 · Action title\n   ' + (g.topic || '—') + ' — ' + (g.num || '—') +
          '\n\n4 · Close on the ask\n   ' + (g.ask || '—') + '\n   Owner and date: ' + (g.owner || '—') +
          '\n\n5 · Before you send\n   Three numbers cold · three hard questions answered · 60 seconds out loud');
      o5.hidden = false;
      o5.textContent = txt;
      if (el.dataset.act === 'planCopy') { try { navigator.clipboard.writeText(txt); } catch (x) {} }
      return;
    }

    if ((el = e.target.closest('[data-act="sixStart"]'))) {
      var r6 = el.closest('[data-w="six"]'), slide = $('.ssSlide', r6), tm = $('.timer', r6), qb = $('.qBlock', r6);
      qb.hidden = true; qb.innerHTML = '';
      slide.hidden = false; tm.hidden = false;
      var n = 6; tm.textContent = n;
      var iv = setInterval(function () {
        n--; tm.textContent = n;
        if (n <= 0) {
          clearInterval(iv); slide.hidden = true; tm.hidden = true;
          var qs = DATA.sixSecond.questions[S.lang];
          qb.hidden = false;
          qb.innerHTML = qs.map(function (q, i) {
            return '<div class="card" style="margin-bottom:.6rem" data-sq="' + i + '">' +
              '<p style="font-weight:600;margin-bottom:.5rem">' + esc(q[0]) + '</p>' +
              q[1].map(function (a, j) { return '<button class="opt" data-sqa="' + i + '-' + j + '">' + esc(a) + '</button>'; }).join('') +
              '</div>';
          }).join('');
        }
      }, 1000);
      return;
    }
    if ((el = e.target.closest('[data-sqa]'))) {
      var pp = el.dataset.sqa.split('-'), q2 = DATA.sixSecond.questions[S.lang][+pp[0]], c2 = el.closest('[data-sq]');
      $$('.opt', c2).forEach(function (o, j) {
        o.classList.toggle('ok', j === q2[2]);
        o.classList.toggle('no', j === +pp[1] && +pp[1] !== q2[2]);
      });
      return;
    }

    /* topbar */
    if (e.target.closest('#bid')) { setLang('id'); return; }
    if (e.target.closest('#ben')) { setLang('en'); return; }
    if (e.target.closest('#blight')) { setTheme('light'); return; }
    if (e.target.closest('#bdark')) { setTheme('dark'); return; }
    if (e.target.closest('#bmode')) { setMode(S.mode === 'learn' ? 'present' : 'learn'); return; }
    if (e.target.closest('#btoc')) { openDrawer(); return; }
    if (e.target.closest('#bprev')) { show(S.i - 1); return; }
    if (e.target.closest('#bnext')) { show(S.i + 1); return; }
    if (e.target.closest('#bfull')) { toggleFull(); return; }
    if (e.target.id === 'drawer') { closeDrawer(); return; }
    if (!e.target.closest('#searchWrap')) { $('#results').classList.remove('on'); }
  });

  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') {
      if (e.key === 'Escape') e.target.blur();
      return;
    }
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); show(S.i + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(S.i - 1); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(SECTIONS.length - 1);
    else if (e.key === '/') { e.preventDefault(); $('#search').focus(); }
    else if (e.key === 'f' || e.key === 'F') toggleFull();
    else if (e.key === 'Escape') { closeDrawer(); if (S.mode === 'present') setMode('learn'); }
  });

  /* search */
  var IDX = null;
  function buildIndex() {
    IDX = [];
    SECTIONS.forEach(function (s, i) {
      var bits = [L(s.title), L(s.kicker), s.lead ? L(s.lead) : ''];
      (s.blocks || []).forEach(function (b) {
        ['text', 'label'].forEach(function (k) { if (b[k]) bits.push(L(b[k])); });
        if (b.items) b.items.forEach(function (x) {
          ['h', 'p', 'cap', 'head', 'body', 'a', 'b', 'q'].forEach(function (k) {
            if (x && x[k]) bits.push(typeof x[k] === 'string' ? x[k] : L(x[k]));
          });
        });
      });
      IDX.push({ i: i, title: L(s.title), kicker: L(s.kicker), hay: bits.join(' ').toLowerCase() });
    });
  }
  $('#search').addEventListener('input', function () {
    var q = this.value.trim().toLowerCase(), box = $('#results');
    if (!IDX) buildIndex();
    if (q.length < 2) { box.classList.remove('on'); return; }
    var hits = IDX.filter(function (r) { return r.hay.indexOf(q) > -1; }).slice(0, 12);
    box.innerHTML = hits.length
      ? hits.map(function (r) {
          return '<button data-goto="' + r.i + '"><span class="rk">' + esc(r.kicker) + '</span>' +
            '<span class="rt">' + esc(r.title) + '</span></button>';
        }).join('')
      : '<div style="padding:.8rem;font-size:.85rem;color:var(--ink-3)">' + t('searchEmpty') + '</div>';
    box.classList.add('on');
  });

  /* toggles */
  function setLang(l) {
    S.lang = l; IDX = null;
    document.documentElement.setAttribute('lang', l);
    renderAll(); save();
  }
  function setTheme(v) {
    S.theme = v; document.documentElement.setAttribute('data-theme', v); labels(); save();
  }
  function setMode(m) {
    S.mode = m; document.documentElement.setAttribute('data-mode', m); labels();
    $('#modeHint').textContent = m === 'learn' ? t('modeLearnHint') : t('modePresentHint');
  }
  function toggleFull() {
    try {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      var ex = document.exitFullscreen || document.webkitExitFullscreen;
      if (document.fullscreenElement || document.webkitFullscreenElement) { if (ex) ex.call(document); }
      else if (req) req.call(el);
    } catch (e) {}
  }
  function openDrawer() { $('#drawer').classList.add('on'); }
  function closeDrawer() { $('#drawer').classList.remove('on'); }

  /* ------------------------------------------------------------- init -- */
  load();
  document.documentElement.setAttribute('data-theme', S.theme);
  document.documentElement.setAttribute('data-mode', S.mode);
  document.documentElement.setAttribute('lang', S.lang);
  renderAll();
  $('#modeHint').textContent = t('modeLearnHint');
})();

</script>
</body>
</html>
