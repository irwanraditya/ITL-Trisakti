<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>English Learning Academy — A1 to Professional English</title>
<meta name="description" content="Self-paced English learning platform from A1 beginner to C1 and professional English, following the CEFR: lessons, vocabulary with spaced repetition, assessments and business simulations.">
<meta name="academic-category" content="Learning">
<meta name="academic-type" content="Learning Platform">
<meta name="academic-description" content="Self-paced English course from A1 to Professional English (CEFR): 99 lessons, vocabulary builder with spaced repetition, placement and stage assessments, listening, speaking and business simulations.">
<meta name="academic-icon" content="En">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link media="all" onerror="this.remove()" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* English Learning Academy — styles. Tokens follow the ITL Trisakti hub (styles.css). */
:root{
  --navy:#0B1F33; --navy-2:#12324F; --teal:#0E7C6B; --teal-2:#14A08A; --teal-bg:#E3F2EF;
  --blue:#2456C7; --purple:#6B3FA0; --orange:#E08424; --red:#B4402F; --green:#2E7D4F;
  --ink:#0B1F33; --ink-2:#40566B; --ink-3:#6B8297;
  --bg:#F6F8FA; --surface:#FFFFFF; --surface-2:#EEF2F6; --line:#D3DEE7;
  --ok-bg:#E5F4EA; --bad-bg:#FBE9E5; --warn-bg:#FDF1E1; --info-bg:#E8EEFB;
  --accent:var(--teal); --on-accent:#fff;
  --shadow:0 1px 2px rgba(11,31,51,.06),0 6px 20px rgba(11,31,51,.07);
  --r:10px; --r-lg:16px;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
html[data-theme="dark"]{
  --navy:#06131F; --navy-2:#0E2436; --teal:#2FA894; --teal-2:#3FBFA8; --teal-bg:#123832;
  --blue:#6B93F2; --purple:#A183D6; --orange:#E7A44C; --red:#E0725F; --green:#5CC489;
  --ink:#E9F0F5; --ink-2:#AEC2D2; --ink-3:#8299AC;
  --bg:#081521; --surface:#0F2434; --surface-2:#16324A; --line:#23415C;
  --ok-bg:#12352A; --bad-bg:#3A1F1C; --warn-bg:#3A2B14; --info-bg:#172A4D;
  --accent:var(--teal-2); --on-accent:#04181A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em}
h1{font-size:1.75rem}h2{font-size:1.35rem}h3{font-size:1.1rem}h4{font-size:1rem}
p{margin:0 0 .8em}
small,.muted{color:var(--ink-2)}
.mono{font-family:var(--mono)}

/* ---------- layout */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{background:var(--navy);color:#DCE7F0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{display:flex;gap:.7em;align-items:center;padding:1.1em 1.2em .9em;text-decoration:none;color:#fff}
.brand .logo{width:38px;height:38px;border-radius:10px;background:var(--teal);display:grid;place-items:center;font-family:var(--serif);font-size:1.35rem;color:#fff;flex:none}
.brand b{display:block;font-size:.98rem;line-height:1.2}
.brand .bs{display:block;font-size:.7rem;color:#9FB4C6;font-family:var(--mono);letter-spacing:.06em;margin-top:.15em}
.scrim{display:none}
.nav{list-style:none;margin:.3em 0 1em;padding:0 .6em}
.nav a{display:flex;gap:.7em;align-items:center;padding:.55em .7em;border-radius:8px;color:#C9D8E5;text-decoration:none;font-size:.92rem}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a[aria-current="page"]{background:var(--teal);color:#fff}
.nav .ic{width:1.4em;text-align:center;font-size:1rem;opacity:.95}
.side .foot{margin-top:auto;padding:1em 1.2em;font-size:.75rem;color:#8EA4B8;border-top:1px solid rgba(255,255,255,.08)}
.side .foot a{color:#BFD3E3}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.content{padding:1.6em 2em 4em;max-width:1180px;width:100%;margin:0 auto}
.crumbs{font-size:.8rem;color:var(--ink-3);margin-bottom:.5em;font-family:var(--mono);letter-spacing:.03em}
.crumbs a{color:var(--ink-2);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.pagehead{display:flex;flex-wrap:wrap;gap:1em;align-items:flex-end;justify-content:space-between;margin-bottom:1.2em}
.pagehead p{margin:.2em 0 0;color:var(--ink-2);max-width:62ch}
.banner{padding:.7em 1em;border-radius:var(--r);margin-bottom:1em;font-size:.92rem;border:1px solid var(--line)}
.banner.warn{background:var(--warn-bg)}.banner.info{background:var(--info-bg)}.banner.bad{background:var(--bad-bg)}

/* ---------- components */
.grid{display:grid;gap:1em}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:1.1em 1.2em;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card h3{margin-bottom:.35em}
.card.link{text-decoration:none;color:inherit;display:block;transition:transform .12s ease,border-color .12s}
.card.link:hover{transform:translateY(-2px);border-color:var(--accent)}
.stat .k{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-size:1.65rem;font-weight:600;line-height:1.15;margin:.15em 0}
.stat .s{font-size:.82rem;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;gap:.45em;padding:.55em 1em;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-decoration:none;color:var(--ink);font-weight:500;font-size:.92rem;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.sm{padding:.3em .65em;font-size:.82rem}
.btn[disabled],.btn.disabled{opacity:.5;cursor:not-allowed;pointer-events:none}
.btns{display:flex;flex-wrap:wrap;gap:.5em;align-items:center}
.tag{display:inline-block;font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;padding:.18em .55em;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.grammar{background:#E8EEFB;color:#2456C7}.tag.vocab{background:#F2EAFB;color:#6B3FA0}
.tag.speaking{background:#FDF1E1;color:#A85B0F}.tag.skills{background:#E3F2EF;color:#0E7C6B}
html[data-theme="dark"] .tag.grammar{background:#172A4D;color:#9DB8F7}html[data-theme="dark"] .tag.vocab{background:#2A2142;color:#C7B0EC}
html[data-theme="dark"] .tag.speaking{background:#3A2B14;color:#F0BE7A}html[data-theme="dark"] .tag.skills{background:#123832;color:#7FD6C4}
.tag.ok{background:var(--ok-bg);color:var(--green)}.tag.lock{background:var(--surface-2);color:var(--ink-3)}.tag.bad{background:var(--bad-bg);color:var(--red)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring b{width:72px;height:72px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:1.15rem}
.row{display:flex;gap:1em;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.mt{margin-top:1em}.mt2{margin-top:2em}.mb{margin-bottom:1em}
.list{list-style:none;margin:0;padding:0}
.list li{padding:.65em 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.lrow{display:flex;gap:.8em;align-items:center;justify-content:space-between;flex-wrap:wrap}
.lrow .t{min-width:0;flex:1}
.lrow a.title{font-weight:600;text-decoration:none;color:var(--ink)}
.lrow a.title:hover{color:var(--accent)}
.lock-ic{color:var(--ink-3)}
.tabs{display:flex;gap:.3em;border-bottom:1px solid var(--line);margin-bottom:1.2em;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs a,.tabs button{padding:.6em .9em;border:0;background:none;border-bottom:3px solid transparent;text-decoration:none;color:var(--ink-2);cursor:pointer;white-space:nowrap;font-size:.92rem}
.tabs [aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.field{display:flex;flex-direction:column;gap:.3em;margin-bottom:.9em}
.field label{font-size:.85rem;font-weight:600}
input[type=text],input[type=number],input[type=search],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.5em .7em;width:100%;max-width:100%}
textarea{min-height:8em;resize:vertical;line-height:1.5}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t th,table.t td{text-align:left;padding:.55em .6em;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.empty{padding:1.2em;border:1px dashed var(--line);border-radius:var(--r);color:var(--ink-2);text-align:center}
.kbd{font-family:var(--mono);font-size:.8em;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 .35em}

/* ---------- stage cards */
.stagecard{position:relative}
.stagecard .lvl{font-family:var(--serif);font-size:2.2rem;line-height:1;color:var(--accent)}
.stagecard.locked{opacity:.72}
.stagecard.locked .lvl{color:var(--ink-3)}

/* ---------- lesson */
.lessonhead{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:1.3em 1.4em;margin-bottom:1em}
.lessonhead h1{margin:.2em 0 .15em}
.lessonhead .sub{color:var(--ink-2);margin:0}
.jump{display:flex;gap:.35em;flex-wrap:wrap;margin:.9em 0 0}
.jump a{font-size:.78rem;padding:.25em .65em;border-radius:99px;background:var(--surface-2);text-decoration:none;color:var(--ink-2)}
.jump a:hover{background:var(--teal-bg);color:var(--accent)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:1.2em 1.4em;margin-bottom:1em;scroll-margin-top:1em}
.sec > h2{display:flex;align-items:center;gap:.5em;font-size:1.15rem}
.sec > h2 .n{font-family:var(--mono);font-size:.7rem;background:var(--teal-bg);color:var(--accent);border-radius:6px;padding:.15em .45em}
.idnote{background:var(--warn-bg);border-left:4px solid var(--orange);padding:.55em .8em;border-radius:6px;font-size:.92rem;margin:.4em 0 .8em}
html.hide-id .idnote,html.hide-id .tr{display:none}
.struct{font-family:var(--mono);font-size:.88rem;background:var(--surface-2);border-radius:8px;padding:.6em .8em;margin:.3em 0}
.forms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8em}
.forms .f{border:1px solid var(--line);border-radius:10px;padding:.7em .8em}
.forms .f h4{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:.4em}
.forms .f p{margin:.2em 0;font-size:.92rem}
.exlist{list-style:none;padding:0;margin:0;counter-reset:ex}
.exlist li{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:.5em;padding:.5em 0;border-bottom:1px solid var(--line);align-items:start}
.exlist li:last-child{border-bottom:0}
.exlist li::before{counter-increment:ex;content:counter(ex);font-family:var(--mono);font-size:.75rem;color:var(--ink-3);padding-top:.2em}
.exlist .en{font-weight:500}
.exlist .tr{display:block;color:var(--ink-2);font-size:.9rem}
.say{border:1px solid var(--line);background:var(--surface);border-radius:99px;width:2em;height:2em;display:inline-grid;place-items:center;cursor:pointer;font-size:.85rem;color:var(--accent);flex:none;padding:0}
.say:hover{border-color:var(--accent)}
.say[disabled]{opacity:.4;cursor:not-allowed}
.voc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8em}
.vcard{border:1px solid var(--line);border-radius:12px;padding:.8em .9em;background:var(--surface)}
.vcard .w{font-weight:600;font-size:1.05rem}
.vcard .p{font-family:var(--mono);font-size:.8rem;color:var(--ink-3)}
.vcard .d{font-size:.9rem;margin:.25em 0}
.vcard .e{font-size:.9rem;font-style:italic;color:var(--ink-2)}
.vcard .x{font-size:.8rem;color:var(--ink-2);margin-top:.3em}
.mistake{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.6em;border-bottom:1px solid var(--line);padding:.6em 0}
.mistake:last-child{border-bottom:0}
.mistake .wr{color:var(--red);text-decoration:line-through;text-decoration-thickness:1px}
.mistake .rt{color:var(--green);font-weight:500}
.mistake .why{grid-column:1/-1;font-size:.88rem;color:var(--ink-2)}
.dlg{display:flex;flex-direction:column;gap:.45em}
.dlg .ln{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.6em;align-items:start}
.dlg .who{font-family:var(--mono);font-size:.75rem;background:var(--surface-2);border-radius:6px;padding:.2em .5em;margin-top:.15em;white-space:nowrap}
.dlg .tr{display:block;font-size:.88rem;color:var(--ink-2)}
.expr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.4em .9em}
.expr div{padding:.45em .6em;border-radius:8px;background:var(--surface-2);font-size:.92rem}
.expr div small{display:block}
.assign{border-left:4px solid var(--accent);background:var(--teal-bg);padding:.8em 1em;border-radius:8px}
.check li{margin:.15em 0}
.summary li{margin:.25em 0}
.done-banner{display:flex;gap:.8em;align-items:center;background:var(--ok-bg);border:1px solid var(--green);color:var(--ink);padding:.7em 1em;border-radius:var(--r);margin-bottom:1em}

/* ---------- quiz engine */
.items{display:flex;flex-direction:column;gap:.8em}
.item{border:1px solid var(--line);border-radius:12px;padding:.85em 1em;background:var(--surface)}
.item .q{font-weight:500;margin-bottom:.55em;display:flex;gap:.5em}
.item .q .qn{font-family:var(--mono);font-size:.75rem;color:var(--ink-3);padding-top:.2em;flex:none}
.item .kind{font-family:var(--mono);font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:.3em}
.opts{display:flex;flex-direction:column;gap:.35em}
.opt{display:flex;gap:.6em;align-items:flex-start;padding:.45em .65em;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:.3em;flex:none}
.opt.right{border-color:var(--green);background:var(--ok-bg)}
.opt.wrong{border-color:var(--red);background:var(--bad-bg)}
.tokens,.built{display:flex;flex-wrap:wrap;gap:.35em;min-height:2.4em}
.built{border:1px dashed var(--line);border-radius:8px;padding:.35em;margin-bottom:.45em}
.tok{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:.25em .6em;cursor:pointer;font-size:.95rem}
.tok:hover{border-color:var(--accent)}
.tok[disabled]{opacity:.35;cursor:default}
.matchrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:.6em;align-items:center;margin:.3em 0}
.fb{margin-top:.6em;padding:.55em .8em;border-radius:8px;font-size:.92rem}
.fb.ok{background:var(--ok-bg)}.fb.no{background:var(--bad-bg)}
.fb b{display:block}
.scorebox{display:flex;gap:1em;align-items:center;flex-wrap:wrap;padding:1em 1.1em;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface-2);margin:1em 0}
.scorebox .big{font-size:2rem;font-weight:700}
.scorebox.pass{background:var(--ok-bg);border-color:var(--green)}
.scorebox.fail{background:var(--warn-bg);border-color:var(--orange)}

/* ---------- vocabulary */
.flash{perspective:1200px;max-width:560px;margin:0 auto}
.flash .face{min-height:230px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow);padding:1.5em;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.4em}
.flash .face .w{font-size:1.9rem;font-weight:600}
.flash .face .p{font-family:var(--mono);color:var(--ink-3)}
.vtable td .w{font-weight:600}
.pill{display:inline-flex;gap:.3em;align-items:center;font-size:.8rem;padding:.2em .6em;border-radius:99px;border:1px solid var(--line)}

/* ---------- planner / calendar / charts */
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.8em;align-items:center;padding:.7em .2em;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task input[type=checkbox]{width:1.25em;height:1.25em;accent-color:var(--accent)}
.task .mins{font-family:var(--mono);font-size:.8rem;color:var(--ink-3)}
.task.done .tt{text-decoration:line-through;color:var(--ink-3)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-family:var(--mono);font-size:.68rem;text-align:center;color:var(--ink-3);padding:.2em 0}
.cal .d{aspect-ratio:1/1;border-radius:6px;background:var(--surface-2);display:flex;align-items:flex-start;justify-content:flex-end;padding:3px 5px;font-size:.72rem;color:var(--ink-2)}
.cal .d.l1{background:#BFE3DB}.cal .d.l2{background:#72C4B2}.cal .d.l3{background:var(--teal);color:#fff}
html[data-theme="dark"] .cal .d.l1{background:#1D4A42}html[data-theme="dark"] .cal .d.l2{background:#2A7366}
.cal .d.today{outline:2px solid var(--orange)}
.cal .d.out{background:transparent}
.cal .d.miss{background:var(--bad-bg)}
.week{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto;gap:.8em;padding:.6em 0;border-bottom:1px solid var(--line);align-items:center}
.week .wn{font-family:var(--mono);font-size:.78rem;color:var(--ink-3)}
.week.cur{background:var(--teal-bg);border-radius:8px;padding-left:.5em;padding-right:.5em}
.chart{width:100%;height:auto;display:block}
.chart .ax{stroke:var(--line)}.chart .lb{fill:var(--ink-3);font-size:11px;font-family:var(--mono)}
.chart .bv{fill:var(--accent)}.chart .bv2{fill:var(--purple)}.chart .val{fill:var(--ink-2);font-size:11px}
.rub{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.6em;align-items:center;padding:.5em 0;border-bottom:1px solid var(--line)}
.rub select{width:auto}
.sim-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8em}
.modal-bg{position:fixed;inset:0;background:rgba(6,19,31,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:1em}
.modal{background:var(--surface);border-radius:var(--r-lg);max-width:480px;width:100%;padding:1.3em 1.4em;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.toast{position:fixed;bottom:1.2em;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:.6em 1.1em;border-radius:99px;font-size:.9rem;z-index:60;box-shadow:var(--shadow)}
.rec{display:inline-block;width:.7em;height:.7em;border-radius:50%;background:var(--red);margin-right:.3em;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.transcript{background:var(--surface-2);border-radius:10px;padding:.8em 1em;margin-top:.6em}
.transcript p{margin:.3em 0}

/* ---------- responsive */
@media (max-width:1080px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:280px;transform:translateX(-100%);transition:transform .2s ease;z-index:40;height:100%}
  .app.navopen .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .scrim{display:none}
  .app.navopen .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30}
  .topbar{display:flex;align-items:center;gap:.6em;padding:.6em 1em;background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
  .topbar button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:.35em .6em;cursor:pointer}
  .topbar b{font-size:.95rem}
  .content{padding:1em 1em 4em}
  .g3,.g2{grid-template-columns:1fr}
  .forms{grid-template-columns:1fr}
  .voc,.expr,.sim-meta{grid-template-columns:1fr}
}
@media (max-width:560px){
  .g4{grid-template-columns:1fr 1fr}
  .g4 > .stat.row{grid-column:1/-1}
  h1{font-size:1.4rem}
  .mistake{grid-template-columns:1fr}
  .lessonhead,.sec{padding:1em}
  .exlist li{grid-template-columns:1.6em minmax(0,1fr) auto}
}
@media print{.side,.topbar,.btns,.jump{display:none}.app{display:block}.sec,.card{box-shadow:none;break-inside:avoid}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

<script>
/* ===================================================================
   English Learning Academy — core: utilities, content index, storage,
   progress and unlock rules, spaced repetition, daily planner, TTS,
   and the quiz engine. Views live in views.js. No backend; progress is
   stored in this browser only (localStorage).
   =================================================================== */
'use strict';
var APP = window.APP = {};
(function (A) {
  // ---------------------------------------------------------- utilities
  var esc = A.esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  A.$ = function (s, r) { return (r || document).querySelector(s); };
  A.$$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var ymd = A.ymd = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var parseYmd = A.parseYmd = function (s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); };
  A.now = function () { return A._fakeNow ? new Date(A._fakeNow) : new Date(); };   // _fakeNow is used by tests only
  var today = A.today = function () { return ymd(A.now()); };
  var addDays = A.addDays = function (s, n) { var d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
  A.daysBetween = function (a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); };
  A.fmtDate = function (s) {
    var d = parseYmd(s); var m = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return d.getDate() + ' ' + m[d.getMonth()] + ' ' + d.getFullYear();
  };
  A.shuffle = function (arr, seed) {
    var a = arr.slice(), s = seed || Math.floor(Math.random() * 1e9);
    var rnd = function () { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; };
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  };
  A.pct = function (a, b) { return b ? Math.round(a * 100 / b) : 0; };
  A.log = function () { if (window.console) console.warn.apply(console, ['[ELA]'].concat([].slice.call(arguments))); };

  // ---------------------------------------------------------- content index
  var E = window.ELA || {};
  var CUR = A.CUR = E.curriculum || { stages: [], config: {}, roadmap: [] };
  var CFG = A.CFG = CUR.config || {};
  A.STAGES = CUR.stages || [];
  A.STAGE_IDS = A.STAGES.map(function (s) { return s.id; });
  A.LESSONS = {};
  (E.lessons || []).forEach(function (l) { A.LESSONS[l.id] = l; });
  A.ORDER = [];            // all lesson ids in curriculum order
  A.META = {};             // id -> {stage, module, moduleTitle, index}
  A.MISSING = [];
  A.STAGES.forEach(function (st) {
    st.modules.forEach(function (m) {
      m.lessons.forEach(function (id) {
        A.META[id] = { stage: st.id, module: m.id, moduleTitle: m.title, index: A.ORDER.length };
        A.ORDER.push(id);
        if (!A.LESSONS[id]) A.MISSING.push(id);
      });
    });
  });
  A.stageById = function (id) { for (var i = 0; i < A.STAGES.length; i++) if (A.STAGES[i].id === id) return A.STAGES[i]; return null; };
  A.stageLessons = function (id) { var s = A.stageById(id), out = []; if (s) s.modules.forEach(function (m) { out = out.concat(m.lessons); }); return out; };
  A.TEXTS = E.texts || [];
  A.SIMS = E.simulations || [];
  A.ASSESS = E.assessments || { placement: null, stages: {}, final: null };

  // Vocabulary database = every lesson vocabulary entry (deduplicated by headword).
  A.VOCAB = []; A.VOCAB_BY_ID = {};
  A.ORDER.forEach(function (lid) {
    var l = A.LESSONS[lid]; if (!l || !l.voc) return;
    l.voc.forEach(function (v) {
      var id = String(v[0]).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      if (!id || A.VOCAB_BY_ID[id]) return;
      var rec = { id: id, w: v[0], pron: v[1] || '', pos: v[2] || '', idm: v[3] || '', def: v[4] || '', ex: v[5] || '', extra: v[6] || '',
        level: A.META[lid].stage, lesson: lid, cat: A.META[lid].moduleTitle };
      A.VOCAB.push(rec); A.VOCAB_BY_ID[id] = rec;
    });
  });

  // ---------------------------------------------------------- storage
  var KEY = 'ela-v1';
  A.storageOK = true;
  var defaults = function () {
    return {
      v: 1, created: today(), settings: { theme: 'system', plan: Object.assign({}, CFG.dailyPlan || {}), vocabTarget: CFG.vocabTarget || 10,
        ttsRate: 0.9, voice: '', showId: true },
      lessons: {}, stages: {}, placement: null, final: null, vocab: {}, daily: {}, sims: {}, texts: {}, writing: {}, speaking: {},
      history: [], last: null
    };
  };
  var merge = function (base, inc) {
    if (!inc || typeof inc !== 'object') return base;
    Object.keys(base).forEach(function (k) {
      if (!(k in inc)) return;
      if (base[k] && typeof base[k] === 'object' && !Array.isArray(base[k]) && inc[k] && typeof inc[k] === 'object' && !Array.isArray(inc[k])) {
        base[k] = k === 'settings' ? merge(base[k], inc[k]) : inc[k];
      } else if (inc[k] !== undefined) base[k] = inc[k];
    });
    return base;
  };
  A.validateState = function (o) {
    return !!(o && typeof o === 'object' && o.v === 1 && typeof o.lessons === 'object' && typeof o.vocab === 'object');
  };
  A.load = function () {
    var raw = null;
    try { raw = window.localStorage.getItem(KEY); } catch (e) { A.storageOK = false; }
    var st = defaults();
    if (raw) {
      try { var o = JSON.parse(raw); if (A.validateState(o)) st = merge(st, o); else A.log('stored state ignored: unexpected format'); }
      catch (e) { A.log('stored state unreadable', e); }
    }
    A.S = st;
    return st;
  };
  A.save = function () {
    try { window.localStorage.setItem(KEY, JSON.stringify(A.S)); A.storageOK = true; }
    catch (e) { A.storageOK = false; A.log('save failed', e); }
  };
  A.resetAll = function () { A.S = defaults(); A.save(); };
  A.exportJSON = function () {
    return JSON.stringify({ app: 'english-learning-academy', exported: new Date().toISOString(), state: A.S }, null, 2);
  };
  A.importJSON = function (text) {
    var o = JSON.parse(text);
    var st = o && o.state ? o.state : o;
    if (!A.validateState(st)) throw new Error('This file is not an English Learning Academy backup.');
    A.S = merge(defaults(), st); A.save(); return true;
  };

  // ---------------------------------------------------------- activity log (study minutes)
  A.day = function (d) {
    d = d || today();
    var r = A.S.daily[d];
    if (!r) r = A.S.daily[d] = { done: {}, mins: 0, lessons: 0, reviews: 0, newWords: 0, tests: 0 };
    return r;
  };
  A.bump = function (field, n) { var r = A.day(); r[field] = (r[field] || 0) + (n || 1); A.save(); };
  A.logHistory = function (kind, ref, score) {
    A.S.history.push({ d: today(), t: Date.now(), kind: kind, ref: ref, score: score });
    if (A.S.history.length > 600) A.S.history = A.S.history.slice(-600);
  };

  // ---------------------------------------------------------- progress and unlocking
  A.L = function (id) { return A.S.lessons[id] || (A.S.lessons[id] = {}); };
  A.isDone = function (id) { return !!(A.S.lessons[id] && A.S.lessons[id].done); };
  var stageIdx = function (id) { return A.STAGE_IDS.indexOf(id); };
  A.placementIndex = function () {   // index of the stage the placement test starts the learner at
    if (!A.S.placement || !A.S.placement.start) return 0;
    return Math.max(0, stageIdx(A.S.placement.start));
  };
  A.stagePassed = function (id) {
    var r = A.S.stages[id];
    if (r && r.passed) return true;
    return stageIdx(id) < A.placementIndex();     // covered by the placement test
  };
  A.stagePassedBy = function (id) {
    var r = A.S.stages[id];
    if (r && r.passed) return 'assessment';
    return stageIdx(id) < A.placementIndex() ? 'placement' : null;
  };
  A.isUnlocked = function (id) {
    var i = stageIdx(id);
    if (i <= 0) return true;
    return A.stagePassed(A.STAGE_IDS[i - 1]) || i <= A.placementIndex();
  };
  A.lessonUnlocked = function (lid) { var m = A.META[lid]; return !!m && A.isUnlocked(m.stage); };
  A.currentStage = function () {
    for (var i = 0; i < A.STAGE_IDS.length; i++) {
      var id = A.STAGE_IDS[i];
      if (A.isUnlocked(id) && !A.stagePassed(id)) return id;
    }
    return A.STAGE_IDS[A.STAGE_IDS.length - 1];
  };
  A.currentLevel = function () {   // highest CEFR level demonstrated
    var lvl = null;
    A.STAGE_IDS.forEach(function (id) { if (A.stagePassed(id)) lvl = id; });
    return lvl;
  };
  A.stageProgress = function (id) {
    var ls = A.stageLessons(id), d = ls.filter(A.isDone).length;
    return { done: d, total: ls.length, pct: A.pct(d, ls.length) };
  };
  A.overall = function () {
    var d = A.ORDER.filter(A.isDone).length;
    var passed = A.STAGE_IDS.filter(function (s) { return A.S.stages[s] && A.S.stages[s].passed; }).length;
    var units = A.ORDER.length + A.STAGE_IDS.length;   // lessons + stage assessments
    return { lessons: d, total: A.ORDER.length, stagesPassed: passed, pct: A.pct(d + passed, units) };
  };
  A.nextLesson = function () {
    for (var i = 0; i < A.ORDER.length; i++) {
      var id = A.ORDER[i];
      if (A.lessonUnlocked(id) && !A.isDone(id) && !A.stagePassed(A.META[id].stage)) return id;
    }
    for (i = 0; i < A.ORDER.length; i++) if (A.lessonUnlocked(A.ORDER[i]) && !A.isDone(A.ORDER[i])) return A.ORDER[i];
    return null;
  };
  A.readiness = function (sid) {
    var ls = A.stageLessons(sid), done = ls.filter(A.isDone);
    var scores = done.map(function (id) { return (A.S.lessons[id].test || {}).best || 0; });
    var avg = scores.length ? Math.round(scores.reduce(function (a, b) { return a + b; }, 0) / scores.length) : 0;
    var share = ls.length ? done.length / ls.length : 0;
    var ready = share >= (CFG.readyLessonShare || 0.8) && avg >= (CFG.readyAvgScore || 75);
    return { share: Math.round(share * 100), avg: avg, ready: ready };
  };
  A.levelLabel = function () {
    var l = A.currentLevel();
    if (!l) return A.S.placement ? 'Pre-A1' : 'Not yet assessed';
    return l === 'PRO' ? 'Professional (C1+)' : l;
  };

  // ---------------------------------------------------------- spaced repetition (1, 3, 7, 14, 30 days)
  var IV = A.IV = CFG.srsIntervals || [1, 3, 7, 14, 30];
  A.inDeck = function (id) { return !!A.S.vocab[id]; };
  A.addWord = function (id) {
    if (!A.VOCAB_BY_ID[id] || A.S.vocab[id]) return false;
    A.S.vocab[id] = { box: 0, due: today(), added: today(), ok: 0, bad: 0, last: null };
    A.bump('newWords'); A.save(); return true;
  };
  A.removeWord = function (id) { delete A.S.vocab[id]; A.save(); };
  A.reviewWord = function (id, correct) {
    var v = A.S.vocab[id]; if (!v) return;
    if (correct) { v.box = Math.min((v.box || 0) + 1, IV.length); v.ok++; }
    else { v.box = 1; v.bad++; }
    v.due = addDays(today(), IV[v.box - 1]);
    v.last = today();
    A.bump('reviews'); A.save();
  };
  A.dueWords = function (d) {
    d = d || today();
    return Object.keys(A.S.vocab).filter(function (id) { return A.VOCAB_BY_ID[id] && A.S.vocab[id].due <= d; });
  };
  A.vocabStats = function () {
    var s = { total: 0, fresh: 0, learning: 0, learned: 0, mastered: 0 };
    Object.keys(A.S.vocab).forEach(function (id) {
      if (!A.VOCAB_BY_ID[id]) return;
      var b = A.S.vocab[id].box || 0; s.total++;
      if (b === 0) s.fresh++; else if (b === 1) s.learning++; else if (b < IV.length) s.learned++; else s.mastered++;
    });
    s.known = s.learned + s.mastered;
    return s;
  };
  A.upcomingReviews = function (days) {
    var out = [];
    for (var i = 1; i <= days; i++) {
      var d = addDays(today(), i);
      out.push({ d: d, n: Object.keys(A.S.vocab).filter(function (id) { return A.S.vocab[id].due === d; }).length });
    }
    return out;
  };
  A.suggestNewWords = function (n) {   // next words from the learner's current and earlier stages
    var cs = stageIdx(A.currentStage());
    return A.VOCAB.filter(function (v) { return stageIdx(v.level) <= cs && !A.S.vocab[v.id]; }).slice(0, n);
  };

  // ---------------------------------------------------------- daily planner
  A.TASKS = [
    { k: 'vocab', name: 'Vocabulary', nameId: 'Kosakata' },
    { k: 'grammar', name: 'Grammar', nameId: 'Tata bahasa' },
    { k: 'listening', name: 'Listening', nameId: 'Menyimak' },
    { k: 'speaking', name: 'Speaking', nameId: 'Berbicara' },
    { k: 'rw', name: 'Reading or writing', nameId: 'Membaca atau menulis' }
  ];
  A.planTotal = function () { var p = A.S.settings.plan, t = 0; A.TASKS.forEach(function (x) { t += +p[x.k] || 0; }); return t; };
  A.dayShare = function (d) {
    var r = A.S.daily[d]; if (!r) return 0;
    var p = A.S.settings.plan, tot = A.planTotal(), got = 0;
    A.TASKS.forEach(function (x) { if (r.done && r.done[x.k]) got += +p[x.k] || 0; });
    return tot ? got / tot : 0;
  };
  A.dayMinutes = function (d) {
    var r = A.S.daily[d]; if (!r) return 0;
    var p = A.S.settings.plan, got = 0;
    A.TASKS.forEach(function (x) { if (r.done && r.done[x.k]) got += +p[x.k] || 0; });
    return Math.max(got, Math.round(r.mins || 0));
  };
  A.isActive = function (d) { return A.dayShare(d) >= (CFG.streakShare || 0.5); };
  A.streak = function () {
    var d = today(), n = 0;
    if (!A.isActive(d)) d = addDays(d, -1);
    while (A.isActive(d)) { n++; d = addDays(d, -1); }
    return n;
  };
  A.missedDays = function (span) {
    var out = [], start = A.S.created;
    for (var i = 1; i <= span; i++) {
      var d = addDays(today(), -i);
      if (d < start) break;
      if (A.dayShare(d) === 0 && !(A.S.daily[d] && A.S.daily[d].mins >= 5)) out.push(d);
    }
    return out;
  };
  A.weekSummary = function () {
    var s = { mins: 0, active: 0, lessons: 0, reviews: 0, newWords: 0, tests: 0, days: [] };
    for (var i = 6; i >= 0; i--) {
      var d = addDays(today(), -i), r = A.S.daily[d] || {};
      var m = A.dayMinutes(d);
      s.days.push({ d: d, mins: m, share: A.dayShare(d) });
      s.mins += m; if (A.isActive(d)) s.active++;
      s.lessons += r.lessons || 0; s.reviews += r.reviews || 0; s.newWords += r.newWords || 0; s.tests += r.tests || 0;
    }
    return s;
  };
  // Automatic completion where progress can be measured; learners can still tick tasks by hand.
  A.autoTasks = function () {
    var r = A.day(), changed = false;
    var set = function (k) { if (!r.done[k]) { r.done[k] = true; changed = true; } };
    if (A.dueWords().length === 0 && (r.newWords || 0) >= (+A.S.settings.vocabTarget || 10)) set('vocab');
    if ((r.lessons || 0) > 0) set('grammar');
    if (r.listening) set('listening');
    if (r.speaking) set('speaking');
    if (r.reading || r.writing) set('rw');
    if (changed) A.save();
  };

  // ---------------------------------------------------------- active study time (counts while the tab is visible and in use)
  A.lastInput = Date.now();
  ['click', 'keydown', 'scroll', 'touchstart'].forEach(function (ev) {
    window.addEventListener(ev, function () { A.lastInput = Date.now(); }, { passive: true, capture: true });
  });
  setInterval(function () {
    if (!A.S || document.hidden) return;
    if (Date.now() - A.lastInput > 120000) return;
    var r = A.day(); r.mins = Math.round(((r.mins || 0) + 0.5) * 10) / 10; A.save();
  }, 30000);

  // ---------------------------------------------------------- text to speech
  A.tts = 'speechSynthesis' in window && typeof window.SpeechSynthesisUtterance === 'function';
  A.voices = function () {
    if (!A.tts) return [];
    return window.speechSynthesis.getVoices().filter(function (v) { return /^en(-|_|$)/i.test(v.lang); });
  };
  A.speak = function (text, onend) {
    if (!A.tts) { A.toast('Audio is not available in this browser. Read the text instead.'); return; }
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(String(text));
      u.lang = 'en-US'; u.rate = +A.S.settings.ttsRate || 0.9;
      var want = A.S.settings.voice, vs = A.voices();

          (pass === null ? '' : pass ? ' · Passed (pass mark ' + opts.passMark + '%)' : ' · Not passed yet (pass mark ' + opts.passMark + '%). Review the explanations and try again.') +
          '</span><button type="button" class="btn sm" data-retake>Retake</button></div>' + (opts.after ? opts.after(res) : '');

  A.buildVocabQuiz = function (mode, pool, n) {

      if (e.target.closest('[data-export]')) {
        var blob = new Blob([A.exportJSON()], { type: 'application/json' }), a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = 'english-academy-progress-' + A.today() + '.json'; document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000); A.toast('Backup downloaded'); return;
      }
      if (e.target.closest('[data-reset]')) {
        A.modal('<h3>Reset all progress?</h3><p>This deletes everything saved in this browser. Type <b>RESET</b> to confirm.</p><div class="field"><input type="text" id="rsin" autocomplete="off" aria-label="Type RESET"></div><div class="btns"><button type="button" class="btn danger" id="rsgo">Reset</button><button type="button" class="btn" data-close>Cancel</button></div>', function (bg, close) {
          bg.querySelector('#rsgo').addEventListener('click', function () {
            if (bg.querySelector('#rsin').value.trim().toUpperCase() !== 'RESET') { A.toast('Type RESET to confirm'); return; }
            A.resetAll(); close(); A.applyTheme(); A.toast('Progress reset'); location.hash = '#/';
          });
        });
      }
    });
    $('#imp').addEventListener('change', function () {
      var f = this.files && this.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        try { A.importJSON(String(rd.result)); A.applyTheme(); A.toast('Backup imported'); A.route(); }
        catch (err) { A.modal('<h3>Import failed</h3><p>' + esc(err.message) + '</p><div class="btns"><button type="button" class="btn" data-close>Close</button></div>'); }
      };
      rd.readAsText(f);
    });
  };

  V.notFound = function () { view().innerHTML = head('Page not found', 'This page does not exist.') + '<a class="btn primary" href="#/">Go to the dashboard</a>'; };

  // ---------------------------------------------------------- theme and router
  A.applyTheme = function () {
    var t = A.S.settings.theme, dark = t === 'dark' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.documentElement.classList.toggle('hide-id', !A.S.settings.showId);
  };
  A.route = function () {
    var raw = (location.hash || '#/').replace(/^#\/?/, ''), parts = raw.split('/').map(function (x) { try { return decodeURIComponent(x); } catch (e) { return x; } });
    var key = parts[0] || '', navKey = key;
    var old = view(), fresh = old.cloneNode(false); old.parentNode.replaceChild(fresh, old);   // drop listeners from the previous view
    try {
      switch (key) {
        case '': V.dashboard(); break;
        case 'path': V.path(parts[1]); break;
        case 'courses': V.courses(); break;
        case 'stage': V.stage(parts[1]); navKey = 'courses'; break;
        case 'lesson': V.lesson(parts[1], parts[2]); navKey = A.LESSONS[parts[1]] && A.LESSONS[parts[1]].type === 'grammar' ? 'grammar' : (A.META[parts[1]] && A.META[parts[1]].stage === 'PRO' ? 'business' : 'courses'); break;
        case 'grammar': V.grammar(); break;
        case 'vocab': V.vocab(parts[1]); break;
        case 'listening': V.listening(parts[1]); break;
        case 'speaking': V.speaking(); break;
        case 'rw': V.rw(parts[1]); break;
        case 'business': V.business(); break;
        case 'sims': V.sims(); break;
        case 'sim': V.sims(parts[1]); navKey = 'sims'; break;
        case 'assess': V.assess(parts[1], parts[2]); break;
        case 'progress': V.progress(); break;
        case 'settings': V.settings(); break;
        default: V.notFound();
      }
    } catch (e) {
      A.log(e);
      view().innerHTML = '<div class="banner bad"><b>Something went wrong while opening this page.</b> ' + esc(e.message) + '</div><a class="btn" href="#/">Dashboard</a>';
    }
    setActiveNav(navKey);
    if (!(key === 'lesson' && parts[2])) window.scrollTo(0, 0);
    if (A.tts) try { window.speechSynthesis.cancel(); } catch (e) {}
    document.title = ($('#view h1') ? $('#view h1').textContent + ' · ' : '') + 'English Learning Academy';
  };
  A.start = function () {
    A.load(); A.applyTheme(); V.shell();
    if (window.matchMedia) try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', A.applyTheme); } catch (e) {}
    window.addEventListener('hashchange', A.route);
    A.route();
  };
})(APP);

</script>
<script>
(function () {
  try { APP.start(); }
  catch (e) {
    var v = document.getElementById('view');
    if (v) v.innerHTML = '<p style="padding:2em">The academy could not start: ' + String(e && e.message).replace(/</g, '&lt;') + '</p>';
    if (window.console) console.error(e);
  }
})();
</script>
</body>
</html>
